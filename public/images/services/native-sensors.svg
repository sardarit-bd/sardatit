<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" fill="none">
  <defs>
    <filter id="sensor-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="hud-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 30)" filter="url(#sensor-shadow)">
    <!-- Central Smartphone Frame -->
    <g transform="translate(200, 20)">
      <!-- Outer Metal Shell -->
      <rect x="0" y="0" width="320" height="550" rx="48" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <rect x="6" y="6" width="308" height="538" rx="42" fill="#020617" />
      <rect x="12" y="12" width="296" height="526" rx="36" fill="#09131e" />

      <!-- Top Camera Notch -->
      <rect x="108" y="24" width="104" height="24" rx="12" fill="#000000" />
      <circle cx="185" cy="36" r="4" fill="#10b981" opacity="0.8" />

      <!-- Active Biometric HUD Viewfinder Reticle -->
      <g transform="translate(48, 80)">
        <circle cx="100" cy="110" r="85" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 4" fill="none" />
        <circle cx="100" cy="110" r="70" stroke="url(#hud-ring)" stroke-width="3" stroke-dasharray="110 30" fill="none" />
        <circle cx="100" cy="110" r="40" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" fill="#10b981" fill-opacity="0.08" />
        
        <!-- LiDAR Scanning Crosshairs -->
        <path d="M100 55 L100 70 M100 150 L100 165 M45 110 L60 110 M140 110 L155 110" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
        
        <text x="100" y="105" fill="#34d399" font-size="11" font-family="system-ui, monospace" font-weight="700" text-anchor="middle">BIOMETRIC 3D</text>
        <text x="100" y="122" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">FACE LOCKED</text>
      </g>

      <!-- Sensor Telemetry Panel -->
      <g transform="translate(24, 320)">
        <rect x="0" y="0" width="248" height="75" rx="16" fill="#0f172a" stroke="#1e293b" />
        <circle cx="34" cy="38" r="16" fill="#10b981" fill-opacity="0.2" />
        <path d="M28 38 l4 4 l8 -8" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="60" y="32" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="700">Raw Camera Controls</text>
        <text x="60" y="49" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">4K 60fps ProRes NDK feed</text>
      </g>

      <g transform="translate(24, 410)">
        <rect x="0" y="0" width="248" height="75" rx="16" fill="#0f172a" stroke="#1e293b" />
        <circle cx="34" cy="38" r="16" fill="#0284c7" fill-opacity="0.2" />
        <path d="M28 34 h12 v8 h-12 z" stroke="#38bdf8" stroke-width="1.5" fill="none" />
        <text x="60" y="32" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="700">SQLite Offline Sync</text>
        <text x="60" y="49" fill="#10b981" font-size="11" font-family="system-ui, sans-serif">CRDT Conflict-Free Engine</text>
      </g>

      <!-- Home Bar -->
      <rect x="100" y="522" width="120" height="4" rx="2" fill="#64748b" />
    </g>

    <!-- Floating Peripheral Hardware Radar (Left Card) -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="175" height="150" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="35" cy="36" r="14" fill="#10b981" fill-opacity="0.2" />
      <circle cx="35" cy="36" r="6" fill="#10b981" />
      <text x="60" y="40" fill="#34d399" font-size="13" font-family="system-ui, monospace" font-weight="800">BLE 5.3</text>
      
      <text x="20" y="80" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Hardware Beacon</text>
      <text x="20" y="100" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Peripheral Range: 45m</text>
      <text x="20" y="125" fill="#10b981" font-size="11" font-family="system-ui, monospace" font-weight="700">● 4 BEACONS LINKED</text>
    </g>

    <!-- Floating SQLite Storage Engine (Right Card) -->
    <g transform="translate(545, 260)">
      <rect x="0" y="0" width="175" height="150" rx="22" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="35" cy="36" r="14" fill="#0284c7" fill-opacity="0.2" />
      <circle cx="35" cy="36" r="6" fill="#38bdf8" />
      <text x="60" y="40" fill="#38bdf8" font-size="13" font-family="system-ui, monospace" font-weight="800">OFFLINE</text>
      
      <text x="20" y="80" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Embedded SQLite</text>
      <text x="20" y="100" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Zero Cloud Dependency</text>
      <text x="20" y="125" fill="#38bdf8" font-size="11" font-family="system-ui, monospace" font-weight="700">● REAL-TIME SYNC</text>
    </g>
  </g>
</svg>
