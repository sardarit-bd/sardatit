<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="phone-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="iphone-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="screen-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purple-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- LEFT PHONE: iPhone Style (React Native / iOS) -->
  <g transform="translate(130, 45)" filter="url(#phone-shadow)">
    <!-- Outer Titanium Rim -->
    <rect x="0" y="0" width="310" height="560" rx="52" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Bezel Inner -->
    <rect x="6" y="6" width="298" height="548" rx="46" fill="#020617" />
    <!-- OLED Screen -->
    <rect x="12" y="12" width="286" height="536" rx="40" fill="url(#screen-grad-1)" />

    <!-- Dynamic Island -->
    <rect x="105" y="24" width="100" height="26" rx="13" fill="#000000" />
    <circle cx="185" cy="37" r="5" fill="#0284c7" opacity="0.8" />
    <circle cx="125" cy="37" r="4" fill="#1e293b" />

    <!-- Status Bar -->
    <text x="36" y="42" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">9:41</text>
    <path d="M255 35 h14 v8 h-14 z M270 37 h2 v4 h-2 z" fill="#94a3b8" />

    <!-- App Header -->
    <text x="32" y="90" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700">iOS Core</text>
    <rect x="200" y="74" width="76" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="238" y="90" fill="#38bdf8" font-size="10" font-family="system-ui, monospace" font-weight="600" text-anchor="middle">REACT</text>

    <!-- 60 FPS Fluidity Graph Card -->
    <rect x="28" y="115" width="254" height="150" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="44" y="142" fill="#64748b" font-size="11" font-family="system-ui, sans-serif" font-weight="600">FRAME TIME</text>
    <text x="44" y="168" fill="#38bdf8" font-size="24" font-family="system-ui, sans-serif" font-weight="800">16.6ms</text>
    <text x="135" y="166" fill="#10b981" font-size="11" font-family="system-ui, sans-serif" font-weight="600">60 FPS Locked</text>
    
    <!-- Smooth Wave -->
    <path d="M44 235 Q 85 190, 125 215 T 205 200 T 260 215" fill="none" stroke="url(#cyan-blue)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M44 235 Q 85 190, 125 215 T 205 200 T 260 215 L 260 245 L 44 245 Z" fill="url(#cyan-blue)" fill-opacity="0.1" />

    <!-- Shared Logic Specs -->
    <rect x="28" y="280" width="254" height="60" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="54" cy="310" r="14" fill="#0284c7" fill-opacity="0.2" />
    <path d="M50 310 l3 3 l6 -6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="78" y="306" fill="#f1f5f9" font-size="12" font-family="system-ui, sans-serif" font-weight="600">95% Codebase Share</text>
    <text x="78" y="322" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">Zero-drift state management</text>

    <!-- Component Render Row -->
    <rect x="28" y="355" width="120" height="75" rx="16" fill="#0f172a" stroke="#1e293b" />
    <text x="42" y="380" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Bridge Latency</text>
    <text x="42" y="408" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700">0.4ms</text>

    <rect x="162" y="355" width="120" height="75" rx="16" fill="#0f172a" stroke="#1e293b" />
    <text x="176" y="380" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Memory Idle</text>
    <text x="176" y="408" fill="#10b981" font-size="18" font-family="system-ui, sans-serif" font-weight="700">42 MB</text>

    <!-- Home Indicator -->
    <rect x="95" y="534" width="120" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- RIGHT PHONE: Android Flagship (Flutter / Native) -->
  <g transform="translate(460, 65)" filter="url(#phone-shadow)">
    <!-- Outer Dark Metal Shell -->
    <rect x="0" y="0" width="310" height="540" rx="44" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="6" y="6" width="298" height="528" rx="38" fill="#020617" />
    <rect x="12" y="12" width="286" height="516" rx="32" fill="url(#screen-grad-2)" />

    <!-- Punch hole camera -->
    <circle cx="155" cy="28" r="7" fill="#000000" />
    <circle cx="155" cy="28" r="3" fill="#0284c7" opacity="0.6" />

    <!-- Status Bar -->
    <text x="32" y="32" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">10:00</text>
    <circle cx="265" cy="28" r="4" fill="#94a3b8" />

    <!-- App Header -->
    <text x="32" y="80" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Android Matrix</text>
    <rect x="200" y="64" width="76" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
    <text x="238" y="80" fill="#60a5fa" font-size="10" font-family="system-ui, monospace" font-weight="600" text-anchor="middle">FLUTTER</text>

    <!-- Shader Performance Module -->
    <rect x="28" y="105" width="254" height="135" rx="18" fill="#0f172a" stroke="#1e293b" />
    <text x="44" y="132" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">SKIA / IMPELLER</text>
    <text x="44" y="160" fill="#60a5fa" font-size="22" font-family="system-ui, sans-serif" font-weight="800">120Hz ProMotion</text>
    
    <!-- Render Bar Chart -->
    <rect x="44" y="195" width="28" height="28" rx="6" fill="#3b82f6" />
    <rect x="80" y="180" width="28" height="43" rx="6" fill="#60a5fa" />
    <rect x="116" y="170" width="28" height="53" rx="6" fill="#06b6d4" />
    <rect x="152" y="160" width="28" height="63" rx="6" fill="#38bdf8" />
    <rect x="188" y="175" width="28" height="48" rx="6" fill="#6366f1" />
    <rect x="224" y="165" width="28" height="58" rx="6" fill="#a855f7" />

    <!-- Native Channels -->
    <rect x="28" y="255" width="254" height="60" rx="16" fill="#0f172a" stroke="#1e293b" />
    <circle cx="54" cy="285" r="14" fill="#10b981" fill-opacity="0.2" />
    <path d="M50 285 l3 3 l6 -6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="78" y="281" fill="#f1f5f9" font-size="12" font-family="system-ui, sans-serif" font-weight="600">NDK Direct Bindings</text>
    <text x="78" y="297" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">Zero-JNI overhead invocation</text>

    <!-- Bottom Metric Card -->
    <rect x="28" y="330" width="254" height="110" rx="16" fill="#0f172a" stroke="#1e293b" />
    <text x="44" y="358" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Cold Boot Start Time</text>
    <text x="44" y="392" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="800">320ms</text>
    <rect x="175" y="365" width="90" height="28" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="220" y="383" fill="#10b981" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">INSTANT</text>
  </g>

  <!-- Central Floating Synchronized Badge -->
  <g transform="translate(370, 260)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="160" height="52" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="28" cy="26" r="12" fill="#0284c7" />
    <path d="M24 26 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="50" y="25" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700">Single Logic</text>
    <text x="50" y="39" fill="#38bdf8" font-size="10" font-family="system-ui, monospace">60 FPS DUAL</text>
  </g>
</svg>
