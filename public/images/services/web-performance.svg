<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" fill="none">
  <defs>
    <filter id="laptop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="laptop-bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Laptop Display Window (Transparent canvas outside) -->
  <g transform="translate(60, 40)" filter="url(#laptop-shadow)">
    <!-- Top Lid Bezel -->
    <rect x="0" y="0" width="800" height="490" rx="28" fill="url(#laptop-bezel)" stroke="#334155" stroke-width="2" />
    <!-- Web Camera Notch -->
    <rect x="365" y="6" width="70" height="12" rx="6" fill="#020617" />
    <circle cx="400" cy="12" r="3" fill="#38bdf8" opacity="0.7" />

    <!-- Browser Screen Canvas -->
    <rect x="14" y="24" width="772" height="452" rx="18" fill="#090d16" />

    <!-- Browser Window Titlebar -->
    <rect x="14" y="24" width="772" height="42" rx="18" fill="#0f172a" />
    <circle cx="40" cy="45" r="5.5" fill="#ef4444" />
    <circle cx="58" cy="45" r="5.5" fill="#f59e0b" />
    <circle cx="76" cy="45" r="5.5" fill="#10b981" />

    <!-- URL Omnibox -->
    <rect x="220" y="32" width="360" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="400" y="49" fill="#94a3b8" font-size="11" font-family="system-ui, monospace" text-anchor="middle">https://next.sardarit.com/edge-render</text>

    <!-- Edge Server Actions Badge -->
    <rect x="680" y="32" width="90" height="26" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1" />
    <text x="725" y="49" fill="#c4b5fd" font-size="10" font-family="system-ui, monospace" font-weight="700" text-anchor="middle">NEXT.JS 16</text>

    <!-- Main Dashboard Body -->
    <!-- Left Column: 100/100 Core Web Vitals Gauge -->
    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="330" height="355" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="30" y="42" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="700">CORE WEB VITALS</text>
      
      <!-- Circular Progress Ring -->
      <circle cx="165" cy="165" r="95" stroke="#1e293b" stroke-width="18" fill="none" />
      <circle cx="165" cy="165" r="95" stroke="url(#gauge-grad)" stroke-width="18" fill="none" stroke-dasharray="596" stroke-dashoffset="0" stroke-linecap="round" />
      <text x="165" y="155" fill="#ffffff" font-size="52" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">100</text>
      <text x="165" y="185" fill="#10b981" font-size="13" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">PERFECT SCORE</text>

      <!-- Sub Metrics Row -->
      <g transform="translate(25, 280)">
        <rect x="0" y="0" width="85" height="52" rx="10" fill="#090d16" />
        <text x="42" y="22" fill="#64748b" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">LCP</text>
        <text x="42" y="42" fill="#10b981" font-size="14" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">0.5s</text>

        <rect x="98" y="0" width="85" height="52" rx="10" fill="#090d16" />
        <text x="140" y="22" fill="#64748b" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">FID</text>
        <text x="140" y="42" fill="#10b981" font-size="14" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">1.2ms</text>

        <rect x="195" y="0" width="85" height="52" rx="10" fill="#090d16" />
        <text x="237" y="22" fill="#64748b" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">CLS</text>
        <text x="237" y="42" fill="#10b981" font-size="14" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">0.00</text>
      </g>
    </g>

    <!-- Right Column: Sub-second TTFB & Edge Metrics -->
    <g transform="translate(400, 95)">
      <!-- TTFB Card -->
      <rect x="0" y="0" width="355" height="165" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="25" y="38" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="700">SUB-SECOND TTFB (TIME TO FIRST BYTE)</text>
      <text x="25" y="82" fill="#38bdf8" font-size="38" font-family="system-ui, sans-serif" font-weight="800">42ms</text>
      <text x="135" y="78" fill="#10b981" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Global Edge Cache Hit</text>

      <!-- Wave Graph -->
      <path d="M25 135 C 75 95, 120 145, 175 115 S 260 130, 330 100" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <path d="M25 135 C 75 95, 120 145, 175 115 S 260 130, 330 100 L 330 150 L 25 150 Z" fill="#38bdf8" fill-opacity="0.1" />

      <!-- Server Actions Card -->
      <g transform="translate(0, 185)">
        <rect x="0" y="0" width="355" height="170" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <text x="25" y="38" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="700">REACT SERVER COMPONENTS (RSC)</text>
        
        <g transform="translate(25, 60)">
          <rect x="0" y="0" width="305" height="38" rx="8" fill="#1e293b" />
          <circle cx="20" cy="19" r="6" fill="#10b981" />
          <text x="36" y="24" fill="#f8fafc" font-size="12" font-family="system-ui, monospace">async function loadUserSession()</text>
          <text x="245" y="23" fill="#10b981" font-size="11" font-family="system-ui, sans-serif" font-weight="700">0kB JS</text>
        </g>

        <g transform="translate(25, 108)">
          <rect x="0" y="0" width="305" height="38" rx="8" fill="#1e293b" />
          <circle cx="20" cy="19" r="6" fill="#38bdf8" />
          <text x="36" y="24" fill="#f8fafc" font-size="12" font-family="system-ui, monospace">useActionState(mutateOrder)</text>
          <text x="250" y="23" fill="#38bdf8" font-size="11" font-family="system-ui, sans-serif" font-weight="700">Instant</text>
        </g>
      </g>
    </g>

    <!-- Laptop Base Stand -->
    <rect x="-40" y="490" width="880" height="14" rx="7" fill="#475569" />
    <rect x="350" y="490" width="100" height="6" rx="3" fill="#334155" />
  </g>
</svg>
