<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0284c7" flood-opacity="0.14" />
    </filter>
    <linearGradient id="core-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stream-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 40)" filter="url(#cloud-shadow)">
    <!-- Interconnected Cyber Streams (Background Network lines) -->
    <path d="M150 140 C 250 100, 320 220, 400 240 S 550 180, 650 140" stroke="url(#stream-glow)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" fill="none" />
    <path d="M150 420 C 260 480, 350 360, 400 340 S 580 440, 680 420" stroke="url(#stream-glow)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" fill="none" />
    <path d="M160 280 L 640 280" stroke="#38bdf8" stroke-width="2" opacity="0.4" fill="none" />

    <!-- Central Cloud Kubernetes Cluster Hub -->
    <g transform="translate(250, 150)">
      <rect x="0" y="0" width="300" height="260" rx="36" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      
      <!-- Internal Cloud Glow -->
      <circle cx="150" cy="110" r="70" fill="#0284c7" fill-opacity="0.1" />
      
      <!-- Kubernetes Logo / Helm Icon -->
      <g transform="translate(115, 65)">
        <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
        <circle cx="35" cy="40" r="14" fill="#38bdf8" />
      </g>

      <text x="150" y="175" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">K8S CLOUD MESH</text>
      <text x="150" y="196" fill="#38bdf8" font-size="11" font-family="system-ui, monospace" text-anchor="middle">Distributed Microservices</text>

      <!-- Cluster Pod Telemetry -->
      <rect x="35" y="215" width="65" height="26" rx="8" fill="#1e293b" />
      <text x="67" y="232" fill="#10b981" font-size="10" font-family="system-ui, monospace" font-weight="700" text-anchor="middle">24 PODS</text>

      <rect x="115" y="215" width="70" height="26" rx="8" fill="#1e293b" />
      <text x="150" y="232" fill="#38bdf8" font-size="10" font-family="system-ui, monospace" font-weight="700" text-anchor="middle">99.99%</text>

      <rect x="200" y="215" width="65" height="26" rx="8" fill="#1e293b" />
      <text x="232" y="232" fill="#a855f7" font-size="10" font-family="system-ui, monospace" font-weight="700" text-anchor="middle">0.8ms</text>
    </g>

    <!-- Node 1: Top Left - GraphQL Federation Gateway -->
    <g transform="translate(50, 70)">
      <rect x="0" y="0" width="180" height="110" rx="20" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" />
      <circle cx="28" cy="30" r="10" fill="#e11d48" fill-opacity="0.3" />
      <text x="48" y="34" fill="#f43f5e" font-size="13" font-family="system-ui, monospace" font-weight="800">GraphQL</text>
      <text x="20" y="66" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Unified Subgraph</text>
      <text x="20" y="86" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">1M Concurrent Req/s</text>
    </g>

    <!-- Node 2: Top Right - Distributed Postgres / CockroachDB -->
    <g transform="translate(570, 70)">
      <rect x="0" y="0" width="180" height="110" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="28" cy="30" r="10" fill="#3b82f6" fill-opacity="0.3" />
      <text x="48" y="34" fill="#60a5fa" font-size="13" font-family="system-ui, monospace" font-weight="800">SQL ENGINE</text>
      <text x="20" y="66" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Global Read Replica</text>
      <text x="20" y="86" fill="#10b981" font-size="10" font-family="system-ui, sans-serif">&lt; 3ms Query Latency</text>
    </g>

    <!-- Node 3: Bottom Left - Kafka Event Stream -->
    <g transform="translate(50, 360)">
      <rect x="0" y="0" width="180" height="110" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="28" cy="30" r="10" fill="#f59e0b" fill-opacity="0.3" />
      <text x="48" y="34" fill="#fbbf24" font-size="13" font-family="system-ui, monospace" font-weight="800">EVENT MESH</text>
      <text x="20" y="66" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Zero-Loss Queue</text>
      <text x="20" y="86" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Pub/Sub Partitioning</text>
    </g>

    <!-- Node 4: Bottom Right - Edge CDN & Serverless Ingress -->
    <g transform="translate(570, 360)">
      <rect x="0" y="0" width="180" height="110" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="28" cy="30" r="10" fill="#10b981" fill-opacity="0.3" />
      <text x="48" y="34" fill="#34d399" font-size="13" font-family="system-ui, monospace" font-weight="800">API INGRESS</text>
      <text x="20" y="66" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Anycast Routing</text>
      <text x="20" y="86" fill="#10b981" font-size="10" font-family="system-ui, sans-serif">DDoS Shield Active</text>
    </g>
  </g>
</svg>
